# odoo-nix:managed — generated by odoo-nix (`odoo-init --sync`); do not edit.
# `ci / pr-policy` (odoo-nix docs: standards/ci.md): the pull request's base, title and
# commits. Its own file, so a retitle reruns only this check; on a push to the integration
# branch the reusable workflow skips it (green), as the release's bump commit needs.
name: pr-policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: ["18.0"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pr-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pr-policy:
    name: ci
    permissions:
      contents: read
      pull-requests: read
    uses: Avunu/odoo-nix/.github/workflows/odoo-pr-policy.yml@1a9b7a74979425584669cc04d841d0ae90894ddb # v2.6.0
    with:
      integration-branch: "18.0"
      runs-on: '["self-hosted","nixos"]'
