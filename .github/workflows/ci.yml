# odoo-nix:managed — generated by odoo-nix (`odoo-init --sync`); do not edit.
# The quality gates (odoo-nix docs: standards/ci.md): one caller job per gate, each named
# `ci`, so the checks read `ci / lint` and `ci / test`. odoo-nix's reusable workflows move
# only with the locked odoo-nix (`odoo-init --sync`).
name: ci
on:
  push:
    branches: ["develop"]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: ci
    permissions:
      contents: read
    uses: Avunu/odoo-nix/.github/workflows/odoo-lint.yml@6becbc27e50dfef42f1dcd6bc27d393804b33171 # v2.3.4
    with:
      integration-branch: "develop"
      runs-on: '["self-hosted","nixos"]'
  test:
    name: ci
    permissions:
      contents: read
    uses: Avunu/odoo-nix/.github/workflows/odoo-test.yml@6becbc27e50dfef42f1dcd6bc27d393804b33171 # v2.3.4
    with:
      integration-branch: "develop"
      runs-on: '["self-hosted","nixos"]'
      test-timeout-minutes: 60
      client-id: ${{ vars.AVUNU_CI_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}
